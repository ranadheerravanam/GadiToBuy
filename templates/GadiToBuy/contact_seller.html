{% extends 'GadiToBuy/base.html' %}

{% block content %}

    <h1>Contact Seller</h1>

    <h3>{{ vehicle.title }}</h3>

        {% csrf_token %}

        {{ form.as_p }}

            class="sell-btn">

            Send Inquiry

        </button>

    </form>

</div>

{% endblock %}
